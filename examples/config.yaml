# Example llm_kit configuration.
# ${VAR} interpolation pulls from the environment at load time.
# ${VAR:-default} supplies a fallback.

llm:
  base_url: ${LLM_BASE_URL:-https://api.anthropic.com}
  chat_completions_path: /v1/messages
  model: ${LLM_MODEL:-claude-haiku-4-5-20251001}
  api_key_env: ANTHROPIC_API_KEY
  message_format: anthropic
  temperature: 0.2
  max_tokens: 1024
  extra_headers: {}

embed:
  base_url: ${EMBED_BASE_URL:-https://api.openai.com}
  embeddings_path: /v1/embeddings
  model: ${EMBED_MODEL:-text-embedding-3-small}
  api_key_env: OPENAI_API_KEY
  encoding_format: float
  # dimensions: 512            # uncomment for Matryoshka truncation
  extra_headers: {}
  # Micro-batch caps: a request flushes when adding the next input would breach
  # either. Defaults track OpenAI's per-request limits.
  max_inputs_per_request: 2048
  max_tokens_per_request: 300000

http:
  connect_timeout_seconds: 10.0
  read_timeout_seconds: 120.0
  write_timeout_seconds: 30.0
  pool_timeout_seconds: 10.0
  max_connections: 256
  max_keepalive_connections: 64
  keepalive_expiry_seconds: 30.0
  http2: true
  llm_retry:
    max_retries: 5
    backoff_base_seconds: 0.5
    backoff_max_seconds: 30.0
    jitter_seconds: 0.25
    retry_on_status: [408, 409, 425, 429, 500, 502, 503, 504]

rate_limit:
  max_concurrent_requests: 64
  requests_per_minute: 3000
  tokens_per_minute: 1500000
  default_chars_per_token: 4.0

image:
  max_concurrent_downloads: 32
  fetch_timeout_seconds: 30.0
  max_bytes: 20971520  # 20 MiB
  default_mime_type: image/png
  cache_size: 4096
  threadpool_encode_threshold_bytes: 1048576  # 1 MiB
  on_failure: raise
  retry:
    max_retries: 3
    backoff_base_seconds: 0.25
    backoff_max_seconds: 10.0
    jitter_seconds: 0.1
    retry_on_status: [408, 429, 500, 502, 503, 504]

batch:
  worker_concurrency: 128
  input_buffer_size: 512
  on_failure: record
  progress_log_every: 100
