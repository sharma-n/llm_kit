[project]
name = "llm_kit"
version = "0.1.0"
description = "Provider-agnostic async toolkit for high-throughput multimodal LLM applications."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Naman Sharma"}
]
license = {text = "MIT"}
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
