[project]
name = "llm_kit"
version = "0.1.0"
description = "Provider-agnostic async toolkit for high-throughput multimodal LLM applications."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Naman Sharma"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
vertex = [
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.6.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
